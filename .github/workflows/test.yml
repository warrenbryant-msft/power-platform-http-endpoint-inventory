name: Test

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File -Include *.ps1,*.psm1
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell parse failure: $($file.FullName)"
            }
          }

      - name: Run tests
        shell: pwsh
        run: |
          Invoke-Pester ./tests/EndpointInventory.Tests.ps1 -CI
